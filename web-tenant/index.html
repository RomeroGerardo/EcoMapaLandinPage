<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ecomapa_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoMapa · Portal Operativo Territorial (CivicLoop Technologies)</title>
    <script>
      (function() {
        const theme = localStorage.getItem('ecomapa-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
